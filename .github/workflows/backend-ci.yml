name: Backend CI

on:
  push:
    branches: [main, delevop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    name: Lint and test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # @supabase/supabase-js needs Node 22+ (native WebSocket); Codespaces runs Node 24.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - name: ESLint (no auto-fix in CI)
        run: npx eslint src/ --max-warnings=0

      # Both suites use mocks and backend/.env.test (public local-demo values): no secrets, no real database.
      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

  security-audit:
    name: Dependency audit (production)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
      # Fails on critical issues. Known open item: zod < 4.6.6 (high), fixed only in zod 4 (breaking
      # upgrade, see TEST_REPORT.md). Run `npm audit --omit=dev` locally for the full list.
      - run: npm audit --omit=dev --audit-level=critical
