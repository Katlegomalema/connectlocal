name: Frontend CI

on:
  push:
    branches: [main, delevop]
    paths:
      - 'frontend/connect-local/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/connect-local/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend/connect-local

jobs:
  analyze-test-build:
    name: Analyze, test and build web apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter analyze

      # The real-upload tests (test/e2e) skip themselves without a running API.
      - run: flutter test

      # Both web apps must compile. The address is a placeholder: CI never talks to a server.
      - name: Build customer + provider app (lib/main.dart)
        run: flutter build web --release -t lib/main.dart --dart-define=API_BASE_URL=https://api.example.invalid

      - name: Build admin site (lib/main_admin.dart)
        run: flutter build web --release -t lib/main_admin.dart -o build/web_admin --dart-define=API_BASE_URL=https://api.example.invalid
